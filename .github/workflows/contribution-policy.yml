name: Contribution policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number to inspect
        required: true
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  policy:
    name: Inspect contribution boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted base only. Never check out or execute code from the PR head here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const {inspect} = require('./.github/scripts/contribution-policy.cjs');
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) throw new Error('Invalid PR number');
            const {data: initial} = await github.rest.pulls.get({...context.repo, pull_number:number});
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const contexts = ['Contribution policy', 'Research validation'];
            const status = (name,state,description) => github.rest.repos.createCommitStatus({...context.repo,sha:initial.head.sha,context:name,state,description,target_url});
            for (const name of contexts) await status(name,'pending','Checking contribution boundaries');
            try {
              const result = await inspect(github,context,number);
              if (result.pr.head.sha !== initial.head.sha) throw new Error('PR head changed; rerun required');
              const managed = ['type:research','type:tooling','type:competition','policy:blocked'];
              const desired = [`type:${result.category}`, ...(result.errors.length ? ['policy:blocked'] : [])];
              for (const label of result.pr.labels.map(l=>l.name).filter(n=>managed.includes(n)&&!desired.includes(n))) {
                await github.rest.issues.removeLabel({...context.repo,issue_number:number,name:label});
              }
              await github.rest.issues.addLabels({...context.repo,issue_number:number,labels:desired});
              const state = result.errors.length ? 'failure' : 'success';
              await status('Contribution policy',state,result.errors.length ? 'Contribution boundaries violated; see check summary' : `${result.category}: contribution boundaries passed`);
              await status('Research validation',state,result.errors.length ? 'Research or protected-path policy failed' : result.category === 'research' ? 'Research files validated; no participant code executed' : 'Not a research PR');
              await core.summary.addHeading(`PR #${number}: ${result.category}`).addRaw(result.errors.length ? result.errors.join('\n') : 'Contribution boundaries passed. Maintainer review is still required.').write();
              if (result.errors.length) core.setFailed('Contribution policy failed');
            } catch(error) {
              for (const name of contexts) await status(name,'failure','Inspection failed closed; rerun required');
              throw error;
            }
