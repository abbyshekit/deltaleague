name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the CLI with local inference and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[local]'
      - name: Run the test suite
        run: python -m pytest -q tests
      - name: Check the CLI entry point
        run: |
          cd "$RUNNER_TEMP"
          delta --help
          delta run --help
          delta evaluate --help
